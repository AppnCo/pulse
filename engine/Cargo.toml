[package]
name = "pulse-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Moteur audio natif de Pulse : lecture des projets .pulse et mixage"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
zip = { version = "9", default-features = false }
cpal = "0.15"
rayon = "1"
# Plugins externes (VST3) : seulement dans l'appli (fonction « ext »)
vst3-host = { version = "0.11", default-features = false, optional = true }

# Audio Units (Mac) : la plupart des FabFilter de Ridwane n'existent qu'en AU sur son Mac
[target.'cfg(target_os = "macos")'.dependencies]
rack = { version = "0.4", optional = true }

[features]
ext = ["dep:vst3-host", "dep:rack"]

[profile.release]
opt-level = 3

# rack modifié pour Pulse (retard des Audio Units : vendor/rack)
[patch.crates-io]
rack = { path = "vendor/rack" }
