[package]
name = "pulse-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Moteur audio natif de Pulse : lecture des projets .pulse et mixage"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
zip = { version = "9", default-features = false }
cpal = "0.15"
# Plugins externes (VST3) : seulement dans l'appli (fonction « ext »)
vst3-host = { version = "0.11", default-features = false, optional = true }

[features]
ext = ["dep:vst3-host"]

[profile.release]
opt-level = 3
