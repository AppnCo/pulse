[package]
name = "pulse-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Moteur audio natif de Pulse : lecture des projets .pulse et mixage"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
zip = { version = "2", default-features = false }
cpal = "0.15"

[profile.release]
opt-level = 3
