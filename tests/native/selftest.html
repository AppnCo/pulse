<!doctype html><meta charset="utf-8"><title>selftest</title><body style="margin:0;background:#111;color:#0f0;font:18px monospace"><pre id="o" style="position:fixed;z-index:9;top:60px;left:10px;background:#000c;padding:10px"></pre>
<iframe id="f" src="studio.html" style="width:100vw;height:100vh;border:0"></iframe>
<script>
const o=document.getElementById('o'); const log=t=>{ o.textContent+=t+'\n'; try{ window.__TAURI__.core.invoke('test_log',{text:t}); }catch{} };
const f=document.getElementById('f'); const sleep=ms=>new Promise(r=>setTimeout(r,ms));
(async()=>{ try{
  await sleep(2500); const w=f.contentWindow; w.__TAURI__=window.__TAURI__;
  w.localStorage.removeItem('pulse_native_play_v2');  // réglage par défaut : moteur natif
  log('PulseNative.available='+w.PulseNative.available+' enabled='+w.PulseNative.isEnabled());
  // un projet avec un clip de 4 s
  const ST=w.eval('state'); log('init…'); const ctx=await w.PulseAudio.init(); log('init ok'); const sr=48000,b=ctx.createBuffer(1,sr*4,sr); const d=b.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.sin(i/sr*6.2832*330)*0.3;
  w.PulseAudio.registerBuffer('stest',b);
  log('save…'); await w.PulsePersist.saveBlob('stest', new Blob([w.PulseAudio.audioBufferToWav(b)],{type:'audio/wav'}),{kind:'import'});
  ST.project.tracks[0].clips=[{id:'stest',start:0,duration:4,offset:0}];
  log('saved'); ST.playhead=1;
  const tPlay=performance.now(); await w.togglePlay(); log('démarrage de la lecture native en '+Math.round(performance.now()-tPlay)+' ms');
  await sleep(1200);
  log('playing='+ST.playing+' isNative='+w.PulseAudio.isNative()+' pos='+w.PulseAudio.getPlaybackPosition().toFixed(2)+' (≈2.2 attendu)');
  log('micro: secureContext='+w.isSecureContext+' mediaDevices='+(typeof w.navigator.mediaDevices)+' getUserMedia='+(w.navigator.mediaDevices&&typeof w.navigator.mediaDevices.getUserMedia)+' appareils='+(w.navigator.mediaDevices?(await w.navigator.mediaDevices.enumerateDevices()).map(d=>d.kind).join(','):'?'));
  { const ports = await window.__TAURI__.core.invoke('midi_ports'); const opened = await window.__TAURI__.core.invoke('midi_start'); log('midi: ports='+JSON.stringify(ports)+' ouverts='+JSON.stringify(opened)); }
  log('rust: '+JSON.stringify(await w.__TAURI__.core.invoke('native_info')));
  // relance (comme un fader bougé) : projet seul, sons déjà gardés par le moteur
  { const via0=(await window.__TAURI__.core.invoke('native_info')).via; const t1=performance.now(); await w.PulseNative.play(ST.project, 2); const dt=Math.round(performance.now()-t1);
    await sleep(300); const ni=await window.__TAURI__.core.invoke('native_info'); log('relance: première='+via0+' puis='+ni.via+' en '+dt+' ms pos='+ni.position.toFixed(2));
    // mute pendant la lecture : pris en direct, la lecture continue (pas de relance)
    const p0=ni.position; ST.project.tracks[0].muted=true; w.PulseAudio.refreshAudibility(ST.project); await sleep(400);
    const n2=await window.__TAURI__.core.invoke('native_info'); log('mute en direct: relances='+(n2.plays-ni.plays)+' avance='+(n2.position-p0).toFixed(2)+' trous='+n2.underruns+' joue='+n2.playing);
    ST.project.tracks[0].muted=false; w.PulseAudio.refreshAudibility(ST.project); }
  // retour casque direct : vrai micro + vraie sortie, volume à ZÉRO (aucun larsen possible pendant le test)
  { const inv=window.__TAURI__.core.invoke; await inv('monitor_gain',{gain:0});
    try { await inv('monitor_track',{json:JSON.stringify({track:{name:'V',effects:['eq','comp','deess','sat','delay','reverb','chorus','limit'],effectParams:{reverb:{wet:30},delay:{wet:20}}},bpm:120})});
      const mi=await inv('monitor_start',{device:'',channel:0,buffer:64}); await sleep(1500); const m2=await inv('monitor_info'); log('monitor running='+m2.running+' buffer='+m2.buffer+' latence='+m2.latency_ms.toFixed(1)+'ms trous='+m2.underruns+' charge_max='+m2.load_max_pct.toFixed(1)+'% (8 effets) entree='+m2.input); }
    catch(e){ log('monitor ERREUR '+e); }
    await inv('monitor_stop'); await sleep(100); log('monitor après stop running='+(await inv('monitor_info')).running);
    // le nom du micro vu par la page doit être retrouvé par le moteur natif
    try { const st=await Promise.race([w.navigator.mediaDevices.getUserMedia({audio:true}), sleep(4000).then(()=>{ throw 'micro non autorisé dans la fenêtre de test (à vérifier à la main)'; })]); const lab=st.getAudioTracks()[0].label; st.getTracks().forEach(t=>t.stop());
      const m3=await inv('monitor_start',{device:lab,channel:0,buffer:64}); log('monitor nom page="'+lab+'" -> natif="'+m3.input+'" running='+m3.running); }
    catch(e){ log('monitor nom ERREUR '+e); }
    await inv('monitor_stop'); }
  // boucle tenue par le moteur natif (sans relance) + vumètres alimentés par le moteur ; volume bas pour ne pas casser les oreilles
  { const inv=window.__TAURI__.core.invoke;
    await w.togglePlay(); await sleep(200);
    ST.project.tracks[0].volume=15; ST.looping=true; ST.loop={start:1,end:2}; ST.playhead=1;
    await w.togglePlay(); await sleep(300); const n0=await inv('native_info');
    let lvl=0, mst=0, out=0, minPos=9, maxPos=0;
    for(let k=0;k<25;k++){ w.PulseAudio.setLoop(ST.loop); await sleep(100); const pos=w.PulseAudio.getPlaybackPosition(); minPos=Math.min(minPos,pos); maxPos=Math.max(maxPos,pos); if(pos<0.98||pos>2.02) out++;
      const mt=w.PulseAudio.getTrackMeters(0); if(mt){ const a=new Float32Array(64); mt.l.getFloatTimeDomainData(a); lvl=Math.max(lvl,a[0]); }
      const ma=w.PulseAudio.getMasterAnalyser(); const b=new Uint8Array(ma.frequencyBinCount); ma.getByteTimeDomainData(b); mst=Math.max(mst,Math.abs(b[0]-128)); }
    const n1=await inv('native_info'); const lv=await inv('native_live');
    log('boucle native: relances='+(n1.plays-n0.plays)+' hors_boucle='+out+' pos_min='+minPos.toFixed(2)+' pos_max='+maxPos.toFixed(2)+' rust_pos='+lv.position.toFixed(2)+' looping='+lv.looping+' trous='+n1.underruns);
    log('vumetres natifs: piste='+lvl.toFixed(3)+' master='+mst+' engineLoops='+w.PulseAudio.loopScheduled());
    // boucle déplacée pendant la lecture : prise en direct
    ST.loop={start:1.2,end:1.8}; for(let k=0;k<15;k++){ w.PulseAudio.setLoop(ST.loop); await sleep(100); } const n2=await inv('native_info'); const lv2=await inv('native_live');
    log('boucle changée: relances='+(n2.plays-n1.plays)+' rust_pos='+lv2.position.toFixed(2)+' looping='+lv2.looping);
    // plugin ajouté puis réglé pendant la lecture : fondu enchaîné, sans relance ni trou
    const t0=(await inv('native_info')); const tr0=ST.project.tracks[0]; tr0.effects=(tr0.effects||[]).concat(['reverb']);
    w.refreshPlaybackSoon(); await sleep(500);
    tr0.effectParams=tr0.effectParams||{}; tr0.effectParams.reverb=Object.assign({},tr0.effectParams.reverb||{},{wet:60}); w.refreshPlaybackSoon(); await sleep(500);
    const t1=await inv('native_info'); const lv3=await inv('native_live');
    log('plugin en direct: relances='+(t1.plays-t0.plays)+' joue='+t1.playing+' trous='+t1.underruns+' looping='+lv3.looping+' rust_pos='+lv3.position.toFixed(2));
    // fenêtres de plugin : spectre et aiguille du compresseur alimentés par le moteur natif
    tr0.effects=tr0.effects.concat(['comp']); tr0.effectParams.comp=Object.assign({},tr0.effectParams.comp||{},{threshold:-40}); w.refreshPlaybackSoon();
    let spMax=-Infinity, gr=null; const bins=new Float32Array(2048); const tq=performance.now();
    for(let k=0;k<20;k++){ const an=w.PulseAudio.getTrackSpectrum(0); if(an){ an.getFloatFrequencyData(bins); for(const v of bins) if(Number.isFinite(v)&&v>spMax) spMax=v; } const g=w.PulseAudio.getCompReduction('t0'); if(g!==null) gr=g; await sleep(50); }
    log('afficheurs plugin: spectre_max='+(Number.isFinite(spMax)?spMax.toFixed(0):'aucun')+' gr='+(gr===null?'aucun':gr.toFixed(1)));
    tr0.effects=tr0.effects.filter(e=>e!=='reverb'&&e!=='comp');
    ST.looping=false; ST.project.tracks[0].volume=100; }
  await w.togglePlay(); await sleep(300);
  // page en ligne (appnco.app) : le canal rapide est refusé, les sons partent en morceaux (stage_put) — la lecture native doit démarrer quand même
  { const inv=window.__TAURI__.core.invoke; w.__pulseForceChunks=true; const n0=await inv('native_info');
    await inv('native_stop'); const { blob } = await w.PulseFile.pack(ST.project);
    await w.PulseNative.sendBytes(new Uint8Array(await blob.arrayBuffer()), 'native_play', { from: '1' }, 'native_play_staged', { from: 1, lp: null }).catch(e=>log('envoi en morceaux ERREUR '+e));
    await sleep(500); const n1=await inv('native_info'); log('envoi en morceaux: joue='+n1.playing+' via='+n1.via+' pos='+n1.position.toFixed(2)); await inv('native_stop'); w.__pulseForceChunks=false; await sleep(300); }
  log('après stop: rust playing='+(await w.__TAURI__.core.invoke('native_info')).playing+' isNative='+w.PulseAudio.isNative()); log('FIN'); window.__TAURI__.core.invoke('test_exit');
 }catch(e){ log('ERREUR '+String(e)+' | '+(e&&e.name)+' | '+(e&&e.message)+' | '+JSON.stringify(e)); } })();
</script>
