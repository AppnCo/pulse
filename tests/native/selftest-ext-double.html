<!doctype html><meta charset="utf-8"><title>selftest deux exemplaires</title><body style="margin:0;background:#111;color:#0f0;font:14px monospace"><pre id="o" style="position:fixed;z-index:9;top:60px;left:10px;background:#000c;padding:8px"></pre>
<iframe id="f" src="studio.html" style="width:100vw;height:100vh;border:0"></iframe>
<script>
// Le même plugin sur deux pistes : on en retire un, on attend sa destruction (20 s), l'autre doit continuer à vivre ;
// puis on retire l'autre et on attend encore. Un plugin à la fois, pour savoir lequel fait tomber l'appli. Aucun son.
const o=document.getElementById('o'); const log=t=>{ o.textContent+=t+'\n'; try{ window.__TAURI__.core.invoke('test_log',{text:t}); }catch{} };
const f=document.getElementById('f'); const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const UN=false;   // TOUR_SED='s/const UN=false/const UN=true/' : un seul exemplaire, chargé puis détruit
const VEUT=/^FabFilter Pro-Q 4$|^Auto-Tune Pro$|^Vocal De-Esser$|Rev PLATE-140|^UAD Pultec EQP-1A$|^bx_XL V3$|^ValhallaVintageVerb$|^HalfTime$|^Pro-C 2$|^kHs Compressor$/i;
(async()=>{ try{
  await sleep(2500); const w=f.contentWindow; w.__TAURI__=window.__TAURI__; const inv=window.__TAURI__.core.invoke;
  const list=await w.PulseExt.scan(false); const seen=new Set(); const pick=list.filter(p=>VEUT.test(p.name)&&!seen.has(p.name)&&seen.add(p.name));
  log('plugins: '+pick.length); let n=0;
  for(const p of pick){ const a='vst#d'+(n++), b='vst#d'+(n++); const nom=(p.path.startsWith('au:')?'AU ':'VST ')+p.name;
    log('début   '+nom);
    await inv('ext_create',{id:a,path:p.path,state:null}); if(UN){ await inv('ext_remove',{id:a}); await sleep(24000); log('ok      '+nom+' (un seul exemplaire, détruit)'); continue; }
    await inv('ext_create',{id:b,path:p.path,state:null});
    await inv('ext_remove',{id:a}); await sleep(24000);
    const st=await inv('ext_state',{id:b}); const l=await inv('ext_params',{id:b});
    await inv('ext_remove',{id:b}); await sleep(24000);
    log('ok      '+nom+' (le 2e vivait encore : état '+st.length+' car., '+l.length+' réglages)');
  }
  log('BILAN: fini sans plantage'); log('FIN OK');
} catch(e){ log('ERREUR '+(e&&e.stack||e)); log('FIN'); } })();
</script>
