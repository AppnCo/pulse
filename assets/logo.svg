            <stop offset="0%" stop-color="#C084FC"/>
            <stop offset="100%" stop-color="#7C3AED"/>
        </linearGradient>
        <linearGradient id="pulseText" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F3EEFF"/>
